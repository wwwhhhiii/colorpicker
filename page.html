<!--
IMPORTANT:
 - don't edit id's that are surrounded with '__'
 - don't edit `onclick` on buttons
-->

<div id="__app-container__">
    <div id="__upper-container__">
        <button class="generic-btn open-file-btn" onclick="loadFile()">Select file</button>
        <button class="generic-btn reload-style-btn" onclick="reloadDynDocs()">Reload style</button>
        <button class="generic-btn select-img-btn" onclick="selectImg()">Select image</button>
        <button class="generic-btn" onclick="exportImg()">Export image</button>
    </div>
    <div id="__main-container__">
        <div id="__groups-container__">
            <button id="add-group-btn" class="generic-btn add-group-btn" onclick="addColorGroup()">+</button>
            <div id="__groups-content__"></div>
        </div>
        <div id="__screenshot-and-desc-container__">
            <div id="__screenshot-view-container__">
                <!-- images of color instances are loaded here on click -->
            </div>
            <div id="__desc-container__">
                <!-- description fields of color instances are loaded here on click -->
            </div>
        </div>
    </div>
    <div id="__lower-container__">
        <button class="generic-btn" onclick="saveFileAs()">Save as</button>
        <button class="generic-btn" onclick="saveFile()">Save file</button>
        <button class="generic-btn" onclick="restoreColors()">Restore colors</button>
        <button class="generic-btn" onclick="restoreOrigColors()">Restore original</button>
    </div>
</div>
