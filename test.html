<div class="upper-container">
    <button class="generic-btn" onclick="openFileDialog()">Select file</button>
</div>

<div class="main-container">
    <div class="result" id="result">Color picker</div>
    <div class="input-box" id="input">

        <!-- ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ DON'T TOUCH ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ -->
        <button class="generic-btn" onclick="reloadDynDocs()">Reload style</button>
        <!-- ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑ DON'T TOUCH ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑ -->

        <input class="colorp" name="Color picker" type="color"/>
    </div>
</div>

<div class="lower-container">

    <!-- ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ DON'T TOUCH ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓ -->
